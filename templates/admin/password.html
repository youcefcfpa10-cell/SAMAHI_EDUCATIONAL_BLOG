{% extends "admin/base.html" %}{% block title %}تغيير كلمة المرور | {{ site_name }}{% endblock %}
{% block admin_content %}<div class="password-panel"><h2>تغيير كلمة مرور المشرف</h2><p>اختر كلمة مرور قوية لا تقل عن 12 رمزاً، وتحتوي على حرف كبير وصغير ورقم.</p>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>كلمة المرور الحالية</label><input type="password" name="old_password" required>
<label>كلمة المرور الجديدة</label><input type="password" name="new_password" minlength="12" required>
<label>تأكيد كلمة المرور</label><input type="password" name="confirm_password" minlength="12" required>
<button class="btn btn-primary" type="submit">تحديث كلمة المرور</button></form></div>{% endblock %}
